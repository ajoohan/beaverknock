/* 중개사에게 그대로 보낼 글. 카톡에 붙여넣을 것이므로 표가 아니라 줄로 쓴다. */
function opsShare(r){
  const shop = r.kind === 'shop';
  const L = [];
  const put = (k, v) => { if(v !== null && v !== undefined && String(v).trim()) L.push(`${k}${v}`); };

  L.push(`[비버노크] 새 조건 · ${shop?'상가':'주거'} · ${(r.dongs||[]).join(' · ')||'하남'}`);
  L.push('');
  if(shop){
    put('업종   ', r.biz);
    L.push(`예산   보증금 ${won(+r.dep||0)} / 월 ${(+r.rent||0).toLocaleString()}만${r.key_money?` · 권리금 ${won(+r.key_money)}까지`:''}`);
    if(r.area_min) put('면적   ', `전용 ${r.area_min}~${r.area_max||''}평`);
    put('입주   ', r.open_when);
    put('층     ', r.shop_floor_free);
    put('설비   ', r.facilities_free);
    put('주차   ', r.park_need ? `${r.park_need}대 필요` : '');
    put('권리금 ', r.key_ok);
    put('간판   ', r.sign_need);
    put('참고   ', r.shop_note);
  }else{
    put('거래   ', r.deal);
    L.push(`예산   ${r.deal==='매매'?'매매가':'보증금'} ${won(+r.dep||0)}${+r.rent?` / 월 ${(+r.rent).toLocaleString()}만`:''}`);
    put('유형   ', [(r.htype||[]).join(' · '), r.rooms && r.rooms!=='무관' ? r.rooms : ''].filter(Boolean).join(' · '));
    put('입주   ', r.when_text);
    put('필수   ', [...(r.musts||[]), r.must_free||''].filter(Boolean).join(' · '));
    put('층     ', r.floor_avoid);
    put('엘리베이터 ', r.elevator);
    put('거주   ', r.household);
    put('대출   ', r.loan_plan);
  }
  put('메모   ', r.memo ? `"${r.memo}"` : '');
  L.push('');
  L.push(`연락처 ${r.name||''} ${fmtPhone(r.phone||'')}`.trim());
  const when = [r.contact_pref, (r.contact_times||[]).join(' · ')].filter(Boolean).join(' · ');
  put('선호   ', when);
  put('접수   ', String(r.created_at||'').replace('T',' ').slice(0,16));
  L.push('');
  L.push('맞는 물건이 있으시면 직접 연락해 주세요.');
  return L.join('\n');
}

function fallbackCopy(txt, ok){
  const t = document.createElement('textarea');
  t.value = txt; t.style.cssText = 'position:fixed;top:-999px;opacity:0';
  document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ toast('복사에 실패했습니다 - 글을 직접 선택해 주세요'); }

}

/* 커서 위치를 카드에 넘겨준다 - CSS 가 빛을 그린다.
   rAF 로 묶어 프레임당 한 번만 쓴다. */
(function(){
  let pending = false, lastEl = null, lx = 0, ly = 0;
  document.addEventListener('mousemove', e => {
    const c = e.target.closest && e.target.closest('.card');
    if(!c) return;
    lastEl = c; lx = e.clientX; ly = e.clientY;
    if(pending) return;
    pending = true;
    requestAnimationFrame(()=>{
      pending = false;
      if(!lastEl || !lastEl.isConnected) return;
      const r = lastEl.getBoundingClientRect();
      lastEl.style.setProperty('--mx', ((lx - r.left) / r.width * 100).toFixed(1) + '%');
      lastEl.style.setProperty('--my', ((ly - r.top) / r.height * 100).toFixed(1) + '%');
    });
  }, {passive:true});
})();

const REDUCED = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 세면 안 되는 숫자를 걸러낸다.
   15:00(타이머) · 010-****-5678(번호) · 8/21(날짜) · 41450-2019-00217(등록번호) */
function countable(t){
  if(/[:\/*]/.test(t)) return null;
  if((t.match(/-/g)||[]).length) return null;
  const m = t.match(/^([^\d]*)(\d[\d,]*(?:\.\d+)?)([^\d]*)$/);
  if(!m) return null;
  const raw = m[2].replace(/,/g,'');
  const n = parseFloat(raw);
  if(!isFinite(n) || n === 0 || n > 9_999_999) return null;
  return {pre:m[1], n, post:m[3], dec:(raw.split('.')[1]||'').length, comma:m[2].includes(',')};
}

const easeOut = t => 1 - Math.pow(1 - t, 3);

function countUp(el, spec, dur, delay){
  const fmt = v => spec.pre
    + (spec.comma ? v.toLocaleString('ko-KR', {minimumFractionDigits:spec.dec, maximumFractionDigits:spec.dec})
                  : v.toFixed(spec.dec))
    + spec.post;
  const done = () => { if(el.isConnected) el.textContent = fmt(spec.n); };

  el.textContent = fmt(0);
  /* 프레임이 안 돌면(숨은 탭 등) 숫자가 0에 멈춘 채로 남는다.
     안 움직이는 것보다 나쁘므로, 반드시 제값으로 끝나도록 보험을 건다. */
  const guard = setTimeout(done, delay + dur + 400);

  const t0 = performance.now() + delay;
  const step = now => {
    if(!el.isConnected){ clearTimeout(guard); return; }
    const p = Math.min(1, Math.max(0, (now - t0) / dur));
    el.textContent = fmt(spec.n * easeOut(p));
    if(p < 1) requestAnimationFrame(step);
    else { clearTimeout(guard); done(); }
  };
  requestAnimationFrame(step);
}

/* 막대: 인라인으로 박힌 최종 크기를 잠시 0으로 되돌렸다가 되돌려준다 */
function growBars(root){
  const bars = [...root.querySelectorAll('i[style*="width:"], i[style*="height:"]')];
  const jobs = [];
  bars.forEach(el => {
    const w = el.style.width, h = el.style.height;
    const horiz = w && w.endsWith('%');
    const vert  = h && h.endsWith('%');
    if(!horiz && !vert) return;
    jobs.push({el, horiz, vert, w, h});
    el.style.transition = 'none';
    if(horiz) el.style.width = '0%';
    if(vert)  el.style.height = '0%';
  });
  if(!jobs.length) return;
  void root.offsetHeight;                 /* 0 을 실제로 반영시킨다 */
  jobs.forEach((j, i) => {
    const d = Math.min(i * 45, 420);
    j.el.style.transition = `width .72s cubic-bezier(.22,1,.36,1) ${d}ms, height .72s cubic-bezier(.22,1,.36,1) ${d}ms`;
    if(j.horiz) j.el.style.width = j.w;
    if(j.vert)  j.el.style.height = j.h;
  });
}

/* 화면이 바뀐 직후 한 번 */
function animateData(root){
  /* 움직임을 줄이도록 설정했거나, 화면이 보이지 않는 상태면 그냥 제값을 둔다 */
  if(REDUCED() || document.visibilityState !== 'visible') return;
  growBars(root);
  const nums = [...root.querySelectorAll('.num')];
  let i = 0;
  nums.forEach(el => {
    if(el.hasAttribute('data-vtimer')) return;         /* 인증 남은시간 */
    if(el.closest('[data-checks]')) return;            /* 명시사항 체크 */
    const spec = countable(el.textContent.trim());
    if(!spec) return;
    countUp(el, spec, 780, Math.min(i * 55, 440));
    i++;
  });
}

/* ══════════ 라우터 ══════════ */
function render(){
  let h = location.hash || '#/';
  /* 계정을 확인하는 몇백 밀리초 - 어떤 가드도 타지 않고 그냥 기다린다 */
  if(S.authBusy){
    $('#app').innerHTML = `
      <div class="scr" style="align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 24px">
        <div class="spin" style="width:26px;height:26px;border:2.5px solid var(--ind100);border-top-color:var(--ind);border-radius:50%"></div>
        <b style="font-size:15px;font-weight:800;color:var(--n900)">로그인하고 있습니다</b>
        <span style="font-size:13px;color:var(--n500)">계정을 확인하는 중입니다. 곧 이어집니다.</span>
      </div>`;
    S.lastRoute = null;
    return;
  }
  /* 딥링크 가드: 선행 단계를 건너뛴 진입을 앞 단계로 되돌린다 */
  if((h==='#/register'||h==='#/detail'||h==='#/contact') && !S.draft.kind){ location.replace('#/kind'); return; }
  /* 내 정보 영역은 로그인이 필요하다 */
  /* 지표 대시보드는 아직 예시 숫자다. 실데이터 화면의 암호를 통과하기 전에는 열지 않는다. */
  if(h==='#/ops' && !OPS.rows){ location.replace('#/ops/live'); return; }
  /* 개인정보 처리방침은 한 벌뿐이다 - 옛 주소로 들어오면 그 문서로 보낸다 */
  if(h==='#/privacy'){ location.replace('/privacy'); return; }
  /* 이미 본인확인을 하셨다면 그대로 이어간다 */
  if(h==='#/contact' && !S.draft.verified && S.idv){
    Object.assign(S.draft, {verified:true, vstep:'done', vmethod:S.idv.vmethod, vat:S.idv.vat,
      name:S.draft.name||S.idv.name, phone:S.draft.phone||S.idv.phone});
  }
  const MINE = h==='#/my' || h==='#/inbox' || h.startsWith('#/proposal/') || h.startsWith('#/connect/') || h.startsWith('#/report/');
  if(MINE && !S.user){ S.afterLogin = h; location.replace('#/login'); return; }
  /* 조건을 걸려면 로그인이 필요하다. 계정이 있어야 받은 제안을 다시 볼 수 있고,
     기기를 바꿔도 남는다. 우회로를 두면 그 이유가 흐려진다. */
  if(h==='#/kind' && !S.user){ S.afterLogin = '#/kind'; location.replace('#/login'); return; }
  if(h.startsWith('#/partner/propose/') && S.timeLeft<=0){ S.timeLeft = 900; }
  S.route = h;
  const parts = h.split('/');
  let html;
  if(h.startsWith('#/proposal/')) html = V['#/proposal'](parts[2]);
  else if(h.startsWith('#/connect/')) html = V['#/connect'](parts[2]);
  else if(h.startsWith('#/report/')) html = V['#/report'](parts[2]);
  else if(h.startsWith('#/partner/demand/')) html = V['#/partner/demand'](parts[3]);
  else if(h.startsWith('#/partner/propose/')) html = V['#/partner/propose'](parts[3]);
  else if(h==='#/partner/join') html = V['#/partner/join']();
  else if(h==='#/partner/stats') html = V['#/partner/stats']();
  else if(h==='#/partner/settings') html = V['#/partner/settings']();
  else if(h==='#/partner/listing/new') html = V['#/partner/listing/new']();
  else if(h.startsWith('#/partner/listing/')) html = V['#/partner/listing'](parts[3]);
  else html = (V[h] || V['#/'])();
  /* 칩 하나 고를 때마다 render() 가 다시 도는 구조라,
     여기서 무조건 맨 위로 올리면 길게 스크롤한 폼에서 화면이 튄다.
     화면이 실제로 바뀔 때만 위로 올리고, 같은 화면이면 보던 위치를 지킨다. */
  const app = $('#app');
  const keep = (S.lastRoute === h) ? app.scrollTop : 0;
  app.innerHTML = html + modalHTML();
  /* #app 에 scroll-behavior:smooth 가 걸려 있어, 그냥 넣으면 위치를 되돌리는 과정이
     '스르륵' 애니메이션으로 보인다. 이 한 번만 즉시 이동으로 바꾼다. */
  const sb = app.style.scrollBehavior;
  app.style.scrollBehavior = 'auto';
  app.scrollTop = keep;
  app.style.scrollBehavior = sb;

  /* 화면이 실제로 바뀐 경우에만 진입 애니메이션을 켠다.
     칩 하나 고를 때마다 다시 재생되면 오히려 산만하다. */
  if(S.lastRoute !== h){
    app.setAttribute('data-enter','');
    clearTimeout(S.enterT);
    S.enterT = setTimeout(()=>app.removeAttribute('data-enter'), 700);
    animateData(app);   /* 지표는 세어 올라가고 막대는 자라난다 */
  }
  S.lastRoute = h;
  refreshAddr();   /* 목록은 DOM 에만 있다 - 재렌더마다 다시 채워준다 */
  slideUnderline();
  requestAnimationFrame(()=>armReveal(app));
  // 슬롯 타이머
  if(h.startsWith('#/partner/propose/')) startTimer(); else stopTimer();
  /* 위치는 로그인 화면에서 미리 여쭙고, 동의하신 경우에만 불러온다.
     아무 설명 없이 브라우저 권한창부터 띄우면 대부분 거절한다. */
  /* 위치는 로그인 직후 한 번만 묻는다 - 조건 등록 화면에서 또 띄우지 않는다 */
  if(!(h==='#/contact' && S.draft.vstep==='code')) stopVTimer();
}
function startTimer(){ if(S.timer) return;
  S.timer=setInterval(()=>{ S.timeLeft=Math.max(0,S.timeLeft-1);
    const el=$('#app .badge.num'); if(el){const m=String(Math.floor(S.timeLeft/60)).padStart(2,'0'),s=String(S.timeLeft%60).padStart(2,'0');
      el.textContent=`슬롯 예약 ${m}:${s}`; if(S.timeLeft<180){el.style.background='var(--dangerbg)';el.style.color='var(--danger)';}}
    if(S.timeLeft===0){ stopTimer(); toast('시간이 지나 슬롯을 반환했습니다 · 작성 내용은 저장돼 있습니다'); render(); }
  },1000);}
function stopTimer(){ if(S.timer){clearInterval(S.timer); S.timer=null;} }

/* 본인확인 문자 유효시간 - 화면을 통째로 다시 그리면 입력 포커스가 날아가므로
   타이머 표시만 직접 갈아끼운다 */
function startVTimer(){ if(S.vtimer) return;
  S.vtimer=setInterval(()=>{ S.vsec=Math.max(0,S.vsec-1);
    const el=$('#app [data-vtimer]');
    if(el){ el.textContent=`${String(Math.floor(S.vsec/60)).padStart(2,'0')}:${String(S.vsec%60).padStart(2,'0')}`;
      if(S.vsec<60) el.style.color='var(--danger)'; }

function meFrom(u, tok){

function readAuthRedirect(){
  const raw = location.hash.slice(1);
  if(!/(^|&)(access_token|error)=/.test(raw)) return false;
  const q = new URLSearchParams(raw);
  const err = q.get('error_description') || q.get('error');
  let back = '#/my';
  try{ back = sessionStorage.getItem('bk.after') || '#/my'; sessionStorage.removeItem('bk.after'); }catch(e){}

  if(err){
    history.replaceState(null, '', location.pathname + '#/login');
    render();
    setTimeout(()=>toast(decodeURIComponent(err).slice(0,80)), 60);
    return true;
  }
  const sess = {
    access_token: q.get('access_token'),
    refresh_token: q.get('refresh_token'),
    expires_at: +(q.get('expires_at') || 0),
  };
  store.set(sess);
  /* 계정을 확인하기 전에 목적지로 보내면 안 된다.
     그 순간 S.user 는 아직 비어 있어서, 내 조건 화면 가드가 로그인 화면으로 되돌린다.
     확인이 끝난 뒤에 보낸다. 기다리는 동안은 빈 화면 대신 한 줄을 띄운다. */
  history.replaceState(null, '', location.pathname);
  S.authBusy = true;
  render();
  hydrate(sess).then(ok => {
    S.authBusy = false;
    location.replace(location.pathname + (ok ? back : '#/login'));
    render();
    toast(ok ? `${(S.user&&S.user.label)||'계정'} 계정으로 로그인했습니다`
             : '계정을 확인하지 못했습니다 - 다시 시도해 주세요');
  });
  return true;
}

/* 저장해 둔 세션으로 사람을 되살린다. 만료됐으면 한 번 갱신해 본다. */
async function hydrate(sess){
  sess = sess || store.get();
  if(!sess || !sess.access_token) return false;
  if(sess.expires_at && sess.expires_at * 1000 < Date.now() + 30000){
    sess = await refreshSession(sess);
    if(!sess) return false;
  }
  try{
    const r = await fetch(`${SB_URL}/auth/v1/user`, {headers: authHeaders(sess.access_token)});
    if(!r.ok){ store.set(null); return false; }
    S.user = meFrom(await r.json(), sess.access_token);
    if(!S.geoTried){ S.geoTried = true; setTimeout(()=>detectRegion(false), 500); }
    return true;
  }catch(e){ return false; }
}

async function refreshSession(sess){
  try{
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST', headers:{apikey: SB_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: sess.refresh_token})});
    if(!r.ok){ store.set(null); return null; }
    const j = await r.json();
    const next = {access_token:j.access_token, refresh_token:j.refresh_token,
                  expires_at: Math.floor(Date.now()/1000) + (j.expires_in||3600)};
    store.set(next); return next;
  }catch(e){ return null; }
}

function signOutRemote(){
  const sess = store.get();
  store.set(null);
  if(!sess || !sess.access_token) return;
  fetch(`${SB_URL}/auth/v1/logout`, {method:'POST', headers: authHeaders(sess.access_token)}).catch(()=>{});
}

/* 스크롤로 들어올 때 한 번만 세운다.
   화면에 이미 보이는 것은 건드리지 않는다 - 전환 스태거가 이미 맡고 있다. */
let REVEAL_IO = null;
function armReveal(root){
  if(REDUCED()) return;
  if(!('IntersectionObserver' in window)) return;
  /* 백그라운드 탭에서는 높이가 0 으로 잡힌다. 그때 무장하면 보이는 것까지 숨기고,
     관찰자는 영영 안 깨어난다 - 내용이 통째로 사라진 것처럼 보인다. 그냥 두고 나간다. */
  if(!root.clientHeight) return;
  if(!REVEAL_IO){
    REVEAL_IO = new IntersectionObserver(es => {
      es.forEach(e => { if(e.isIntersecting){
        e.target.setAttribute('data-reveal','in');
        REVEAL_IO.unobserve(e.target);
      }});
    }, {root: root, rootMargin: '0px 0px -8% 0px', threshold: .06});
  }
  const h = root.clientHeight;
  let n = 0;
  root.querySelectorAll('.card, .recap, section, .beaverbox').forEach(el => {
    if(el.closest('[data-reveal]')) return;
    const top = el.getBoundingClientRect().top - root.getBoundingClientRect().top;
    if(top < h - 40) return;              /* 이미 보이는 것은 그냥 둔다 */
    el.setAttribute('data-reveal','');
    el.setAttribute('data-d', String((n++ % 3) + 1));
    REVEAL_IO.observe(el);
  });
  /* 관찰자가 어떤 이유로든 안 깨어나도 내용이 갇히면 안 된다.
     숨긴 채로 두느니 모션을 포기하고 보여준다. */
  clearTimeout(armReveal._t);
  armReveal._t = setTimeout(()=>{
    root.querySelectorAll('[data-reveal=""]').forEach(el=>el.setAttribute('data-reveal','in'));
  }, 2600);
}

      S.form={};
      go('#/partner/listing/'+L.id);
      toast(n? `등록 완료 - 맞는 손님 ${n}명을 찾았습니다` : '등록 완료 - 맞는 손님이 오면 알려드립니다');
      return true; }
    case 'del-listing': { S.listings=S.listings.filter(x=>x.id!==v); toast('물건을 내렸습니다'); go('#/partner/listings'); return true; }
    case 'propose-with': { const [lid,did]=v.split('|'); const L=S.listings.find(x=>x.id===lid); const d=S.demands.find(x=>x.id===did);
      if(!L||!d) return true;
      const st=matchStages(L,d);
      S.form={ ptab:S.form.ptab, photos:L.photos, filled:true, addr:L.name, bname:L.name,
        area:(L.py*3.305785).toFixed(1), dep:String(L.dep), rent:String(L.rent), fee:String(L.fee),
        feeType:'정액관리비', rooms:String(L.rooms||''), baths:String(L.baths||1),
        floorMode:'고·중·저', band:L.band==='1층만'?'저층':L.band, moveIn:'협의', dir:'남동',
        fromListing:L.id,
        msg: st[4].miss.length
          ? `요청하신 조건 중 지역·예산·${L.kind==='home'?'방수':'면적'}는 맞습니다. ${st[4].miss.join('·')}은(는) 확인이 필요합니다 - 솔직히 말씀드립니다.`
          : `요청하신 조건에 모두 맞는 물건입니다. ${L.name}, ${priceOf(L)}. 바로 보여드릴 수 있습니다.` };
      S.timeLeft=900; go('#/partner/propose/'+d.id);
      toast('물건 정보를 불러왔습니다 - 확인 후 보내세요'); return true; }
    case 'withdraw': { const p=S.myprops.find(x=>x.id===v); p.status='withdrawn'; p.reason='회수하셨습니다 · 슬롯 반환됨';
      toast('회수했습니다 · 슬롯이 반환됐습니다'); render(); return true; }
  }
  return false;
}

/* 바깥을 누르면 목록을 접는다 */
document.addEventListener('click', e=>{
  if(e.target.closest('.ac')) return;
  const box=$('#app [data-aclist]'); if(box && box.innerHTML) box.innerHTML='';
}, true);

/* 주소 자동완성 - 손을 마우스로 옮기지 않고도 고를 수 있어야 한다 */
document.addEventListener('keydown', e=>{
  if(!e.target.closest('[data-in="dongFree"]')) return;
  const box=$('#app [data-aclist]'); if(!box) return;
  const opts=$$('button', box); if(!opts.length) return;
  let i=opts.findIndex(o=>o.classList.contains('hi'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(i>=0) opts[i].classList.remove('hi');
    i = e.key==='ArrowDown' ? (i+1)%opts.length : (i<=0 ? opts.length-1 : i-1);
    opts[i].classList.add('hi'); opts[i].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){ e.preventDefault(); opts[i>=0?i:0].click(); }
  else if(e.key==='Escape'){ box.innerHTML=''; }
});

/* 모바일 조건 선택 셀렉트 */
document.addEventListener('change', e=>{
  const s=e.target.closest('[data-act="pick-cond-sel"]'); if(s){ S.inboxCond=s.value; render(); }
});

/* 기기 구분은 창 너비가 정한다 - 사람이 버튼으로 고르던 자리다.
   768px 을 경계로 삼고, 창을 줄이거나 화면을 돌리면 바로 따라간다. */
const MOQ = window.matchMedia('(max-width: 767px)');
function syncDevice(first){
  const dev = MOQ.matches ? 'mo' : 'pc';
  if(dev === S.device && !first) return;
  S.device = dev;
  document.body.className = dev;
  if(!first) render();
}
MOQ.addEventListener('change', ()=>syncDevice(false));
syncDevice(true);

window.addEventListener('hashchange', render);

/* 돌아온 주소에 토큰이 붙어 있으면 먼저 걷어낸다 - 해시 라우터와 자리가 겹친다.
   저장된 세션이 있으면 되살린 뒤에 그린다. 안 그러면 로그인한 사람을 로그인 화면으로 보낸다. */
if(!readAuthRedirect()){
  if(store.get()) hydrate().then(()=>render()); else render();
}
</script>
