<style>
/* ===== 비버노크 디자인 토큰 (03_브랜드/tokens.css) ===== */
:root{
  --ind900:#23255C; --ind700:#31336F; --ind:#3D3F8F; --ind300:#6E70BC; --ind100:#E9E9F7; --ind50:#F5F5FC;
  --navy900:#0C1129; --navy800:#121936; --navy700:#1C2547; --navy600:#2E3A62; --navy400:#4C5678;
  --clay900:#5E472B; --clay700:#8A6A45; --clay:#C9A87C; --clay200:#E0CBAC; --clay100:#F5EDE2;
  --n900:#1F1D1A; --n700:#4A4640; --n500:#857F76; --n300:#D6D1C8; --n100:#F0EDE7; --n50:#FAF8F5; --white:#fff;
  --ok:#1B7A46; --okbg:#EAF6EF; --danger:#B22B31; --dangerbg:#FBEFEF; --warn:#C2660A; --warnbg:#FEF3E7;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;
  --sh1:0 2px 12px rgba(35,37,92,.06); --sh2:0 10px 30px rgba(35,37,92,.10); --sh3:0 16px 40px rgba(61,63,143,.26);
  --warm:linear-gradient(180deg,#FDFCF9 0%,#F8F3EA 60%,#F5EDE2 100%);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:#E7E4DF;color:var(--n900);-webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px}
/* 한글 조판 규칙: 어절(띄어쓰기) 단위로만 끊고, 긴 영문·숫자는 강제 줄바꿈 허용 */
#app,#app *{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
#app h1,#app h2,#app h3,#app .t,#app b{text-wrap:balance}
#app p,#app .sub,#app .txt,#app li,#app small{text-wrap:pretty}
/* PC에서만 의도한 줄바꿈 — 모바일에서는 자연 흐름 */
body.mo #app br.mbr{display:none}
#app .measure{max-width:62ch}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,textarea,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* ===== 개발용 툴바 ===== */
#bar{position:sticky;top:0;z-index:100;width:100%;background:rgba(12,17,41,.96);color:#fff;backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:16px;padding:10px 22px;flex-wrap:wrap}
#bar .brand{font-size:14px;font-weight:800;letter-spacing:-.02em}
#bar .tag{font-size:10.5px;font-weight:700;color:#9AA3BF;border:1px solid var(--navy600);border-radius:var(--r-full);padding:3px 9px}
#bar .grp{display:flex;gap:4px;background:var(--navy700);border-radius:var(--r-full);padding:3px}
#bar .grp button{font-size:11.5px;font-weight:800;color:#9AA3BF;border-radius:var(--r-full);padding:5px 13px;white-space:nowrap}
#bar .grp button.on{background:var(--ind300);color:#fff}
#bar .sp{flex:1}
#bar .hint{font-size:11px;color:#6E7796}
#bar select{background:var(--navy700);color:#DDE0E8;border:1px solid var(--navy600);border-radius:var(--r-sm);
  font-size:11.5px;font-weight:700;padding:6px 9px;max-width:230px}

/* ===== 화면 프레임 ===== */
#stage{padding:26px 20px 0;width:100%;display:flex;justify-content:center}
#frame{background:var(--white);overflow:hidden;flex:none;position:relative;box-shadow:0 20px 50px rgba(28,37,71,.20)}
body.pc #frame{width:1440px;max-width:100%;height:900px;border-radius:8px}
body.mo #frame{width:390px;height:844px;border-radius:32px;border:7px solid #17161A}
#app{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth}
#app::-webkit-scrollbar{width:9px}
#app::-webkit-scrollbar-thumb{background:#DCD8D0;border-radius:9px;border:3px solid transparent;background-clip:content-box}

/* ===== 공통 UI ===== */
.scr{min-height:100%;display:flex;flex-direction:column;background:var(--warm)}
.scr.plain{background:var(--white)}
.scr.dark{background:var(--navy900);color:#F0EDE7}
.pad{padding:0 76px}
body.mo .pad{padding:0 22px}

.nav{display:flex;align-items:center;gap:30px;height:74px;flex:none;position:relative;z-index:5}
body.mo .nav{height:auto;padding-top:48px;padding-bottom:12px;gap:10px;border-bottom:1px solid var(--n100);background:var(--white)}
.nav.solid{background:var(--white);border-bottom:1px solid var(--n100)}
.logo{font-size:19px;font-weight:800;letter-spacing:-.025em;color:var(--ind);flex:none}
body.mo .logo{font-size:16px}
.nav .items{display:flex;gap:4px}
.nav .items a{font-size:14px;font-weight:600;color:var(--n500);padding:8px 13px;border-radius:var(--r-sm)}
.nav .items a:hover{background:var(--n50);color:var(--n700)}
.nav .items a.on{font-weight:800;color:var(--ind);background:var(--ind50)}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--n500)}
body.mo .nav .items{display:none}
.back{font-size:14.5px;color:var(--n500);font-weight:600;padding:6px 10px;border-radius:var(--r-sm)}
.back:hover{background:var(--n50)}

/* 모든 변형이 같은 크기로 그려지도록 테두리를 항상 1.5px 잡아둔다 —
   활성/비활성은 두께가 아니라 색으로만 구분한다 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;
  border:1.5px solid transparent;
  font-weight:800;letter-spacing:-.02em;transition:transform .12s,box-shadow .15s,background .15s;text-align:center}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--ind);border-color:var(--ind);color:#fff;box-shadow:0 12px 30px rgba(61,63,143,.24)}
.btn.pri:hover{background:var(--ind700);border-color:var(--ind700)}
.btn.sec{border:1.5px solid var(--n300);background:var(--white);color:var(--ind)}
.btn.sec:hover{border-color:var(--ind)}
.btn.ghost{color:var(--n700);font-weight:700;border-color:var(--n100);background:var(--n50)}
.btn.ghost:hover{background:var(--n100);border-color:var(--n300)}
.btn.lg{padding:17px 44px;font-size:16.5px}
.btn.md{padding:13px 28px;font-size:14.5px}
.btn.sm{padding:9px 18px;font-size:12.8px;font-weight:700}
.btn.blk{width:100%}
.btn[disabled]{background:var(--n100)!important;color:#C9C4BB!important;box-shadow:none!important;cursor:not-allowed;border-color:var(--n100)!important}

.chip{border:1.5px solid var(--n300);background:var(--white);color:var(--n700);border-radius:10px;
  padding:10px 17px;font-size:14px;transition:all .12s}
.chip:hover{border-color:var(--ind300)}
.chip.on{background:var(--ind);border-color:var(--ind);color:#fff;font-weight:700}
body.mo .chip{padding:9px 15px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.map{width:100%;height:auto;display:block;border-radius:12px;background:#F2F5F7;border:1px solid var(--hair)}
.mapcell path,.mapcell{transition:fill .13s ease,stroke .13s ease}
.mapcell{cursor:pointer}
.mapcell:hover{stroke:var(--ind);stroke-width:2.2}
.mapcell text{pointer-events:none;user-select:none}

.card{background:var(--white);border:1px solid var(--n100);border-radius:var(--r-lg);box-shadow:var(--sh1)}
.card.hi{border:1.5px solid var(--ind);box-shadow:var(--sh2)}
.card.pad{padding:22px 24px}
body.mo .card.pad{padding:17px}
.clickable{cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s}
.clickable:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--ind300)}

.lab{display:block;font-size:13.5px;font-weight:800;margin-bottom:9px}
.lab .req{color:var(--ind)}
.lab .opt{font-weight:500;color:var(--n500);font-size:12.5px}
.inp{width:100%;border:1.5px solid var(--n300);background:var(--white);
  padding:13px 15px;font-size:15px;color:var(--n900);outline:none;transition:border-color .12s}
.inp:focus{border-color:var(--ind)}
.inp::placeholder{color:#C9C4BB}
.unit{position:relative}
.unit .inp{padding-right:44px}
.unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13.5px;color:var(--n500);pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
body.mo .grid2.mo1{grid-template-columns:1fr}

.badge{display:inline-block;border-radius:var(--r-full);padding:4px 11px;font-size:11.5px;font-weight:800;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)} .b-warn{background:var(--warnbg);color:var(--warn)}
.b-ind{background:var(--ind100);color:var(--ind)} .b-mute{background:var(--n100);color:var(--n500)}
.b-danger{background:var(--dangerbg);color:var(--danger)}

.gauge{height:6px;border-radius:var(--r-full);background:var(--n100);overflow:hidden}
.gauge i{display:block;height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--ind300),var(--ind));
  transition:width .45s cubic-bezier(.2,.8,.2,1)}

.chk{display:flex;gap:12px;align-items:flex-start;padding:14px 0;cursor:pointer}
.chk .box{flex:none;width:21px;height:21px;border-radius:7px;border:1.8px solid var(--n300);background:var(--white);
  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .12s}
.chk.on .box{background:var(--ind);border-color:var(--ind)}
.chk .box svg{opacity:0;width:11px}
.chk.on .box svg{opacity:1}
.chk .txt{font-size:13.8px;line-height:1.55;color:var(--n700)}
.chk .txt small{display:block;margin-top:3px;font-size:12.2px;color:var(--n500);line-height:1.5}

h1.t{margin:0;font-weight:800;letter-spacing:-.045em;line-height:1.32;text-wrap:balance}
.sub{margin:8px 0 0;font-size:14.5px;color:var(--n500);line-height:1.6}
.muted{color:var(--n500)}
.kv{display:flex;font-size:14px;line-height:1.65;margin-bottom:5px}
.kv dt{flex:none;width:96px;font-weight:700;color:var(--n500)}
.kv dd{margin:0;color:var(--n900)}
.sect{font-size:12.5px;font-weight:800;color:var(--ind);display:block;margin-bottom:10px}
hr.hair{border:none;border-top:1px solid var(--n100);margin:0}

/* 좌측 스텝 레일 (PC) */
.rail{flex:none;width:360px;background:var(--white);border-right:1px solid var(--n100);padding:38px 36px;display:flex;flex-direction:column}
body.mo .rail{display:none}
.rail .step{display:flex;gap:14px;align-items:center;padding:10px 0}
.rail .dot{flex:none;width:28px;height:28px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;border:1.5px solid var(--n300);color:var(--n500)}
.rail .step.on .dot{background:var(--ind);border-color:var(--ind);color:#fff}
.rail .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.rail .step span{font-size:14.5px;font-weight:600;color:var(--n500)}
.rail .step.on span{font-weight:800;color:var(--n900)}
.split{display:flex;flex:1;min-height:0}
.formcol{flex:1;display:flex;justify-content:center;overflow-y:auto;padding:40px 30px}
body.mo .formcol{padding:20px 22px 0}
.formcol .in{width:100%;max-width:700px;display:flex;flex-direction:column;gap:24px}
body.mo .formcol .in{gap:20px}

/* 모바일 진행바 */
.mprog{display:none}
body.mo .mprog{display:block;height:3px;background:var(--n100);flex:none}
body.mo .mprog i{display:block;height:100%;background:var(--ind);transition:width .4s}

/* 하단 고정 CTA */
.foot{flex:none;padding:16px 76px 30px;background:var(--white);border-top:1px solid var(--n100);
  display:flex;align-items:center;justify-content:space-between;gap:14px}
body.mo .foot{padding:13px 22px 26px}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:200;opacity:0;pointer-events:none;
  background:var(--navy900);color:#fff;font-size:13.5px;font-weight:700;padding:13px 22px;border-radius:var(--r-full);
  box-shadow:0 14px 36px rgba(12,17,41,.34);transition:opacity .22s,transform .22s;max-width:80vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 모달 */
.modal{position:absolute;inset:0;z-index:60;background:rgba(31,29,26,.42);display:flex;align-items:center;justify-content:center;padding:26px}
body.mo .modal{align-items:flex-end;padding:0}
.modal .box{background:var(--white);border-radius:20px;padding:28px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(12,17,41,.28)}
body.mo .modal .box{border-radius:22px 22px 0 0;max-width:none}
/* 선택지 — 눌러서 고르는 것 */
.optbtn{display:block;width:100%;text-align:left;border:1.5px solid var(--n300);background:var(--white);
  border-radius:10px;padding:14px 16px;font-size:14.5px;font-weight:600;color:var(--n700);margin-bottom:9px;cursor:pointer}
.optbtn:hover{border-color:var(--ind300)}
.optbtn.on{border-color:var(--ind);background:var(--ind50);color:var(--ind);font-weight:800}

/* 안내문 — 읽는 것. 테두리도 배경도 없다 */
.opt{font-weight:500;color:var(--n500);font-size:12.5px;line-height:1.5}

/* 빈 상태 */
.empty{text-align:center;padding:52px 30px;border:1px dashed var(--n300);border-radius:var(--r-lg);background:rgba(255,255,255,.6)}

/* 비버 안내 박스 */
.beaverbox{display:flex;align-items:center;gap:14px;padding:15px 18px;background:rgba(245,237,226,.92);border-radius:var(--r-lg)}
.beaverbox svg{width:58px;flex:none}
.beaverbox p{margin:0;font-size:12.8px;line-height:1.6;color:var(--n700)}

/* 스크롤 페이드인 */
.fade{animation:fade .28s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ═══ 품질 패스: 질감 · 그림자 · 포커스 · 마이크로 타이포 ═══ */
:root{
  --sh1:0 1px 2px rgba(35,37,92,.04), 0 4px 14px rgba(35,37,92,.05);
  --sh2:0 2px 6px rgba(35,37,92,.05), 0 14px 34px rgba(35,37,92,.09);
  --sh3:0 4px 10px rgba(61,63,143,.16), 0 18px 44px rgba(61,63,143,.24);
  --hair:rgba(31,29,26,.07);
}
/* 종이 질감 — 아주 미세하게만 */
.scr{position:relative}
.scr::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.035'/></svg>")}
.scr > *{position:relative;z-index:1}
.scr.dark::before{opacity:.35}

/* 카드 — 헤어라인 + 상단 하이라이트 */
.card{border-color:var(--hair);box-shadow:var(--sh1);transition:box-shadow .18s ease,border-color .18s ease,transform .18s cubic-bezier(.2,.8,.2,1)}
.card.hi{border-color:rgba(61,63,143,.45);box-shadow:var(--sh2)}
.clickable:hover{transform:translateY(-3px)}
.clickable:active{transform:translateY(-1px)}

/* 버튼 — 눌림 반응 정교화 */
.btn{transition:background .16s ease,box-shadow .18s ease,transform .12s cubic-bezier(.2,.8,.2,1),border-color .16s ease}
.btn.pri:hover{box-shadow:0 6px 14px rgba(61,63,143,.20),0 20px 46px rgba(61,63,143,.26)}
.btn.pri:active{transform:translateY(1px) scale(.995)}
.btn.sec:hover{background:var(--ind50)}

/* 칩 */
.chip{transition:background .14s ease,border-color .14s ease,color .14s ease,transform .12s ease}
.chip:active{transform:scale(.97)}
.chip.on{box-shadow:0 4px 12px rgba(61,63,143,.18)}

/* 입력 */
.inp{transition:border-color .14s ease,box-shadow .14s ease}
.inp:focus{border-color:var(--ind);box-shadow:0 0 0 3px rgba(61,63,143,.10)}

/* 접근성 포커스 */
:focus-visible{outline:2px solid var(--ind);outline-offset:2px;border-radius:4px}
#app :focus-visible{outline-offset:3px}

/* 마이크로 라벨 — 섹션 표식 */
.sect{letter-spacing:.02em;font-size:12px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--n500)}
.eyebrow::before{content:"";width:14px;height:1.5px;background:var(--clay);border-radius:2px}

/* 구분선 */
hr.hair{border-top:1px solid var(--hair)}

/* 빈 상태 — 더 조용하게 */
.empty{border-color:var(--hair);background:rgba(255,255,255,.55);border-radius:var(--r-lg);padding:44px 30px}

/* 뱃지 — 살짝 조여서 */
.badge{letter-spacing:-.01em;padding:4px 10px}

/* 폼 라벨 리듬 */
.lab{letter-spacing:-.01em;margin-bottom:10px;line-height:1.45}
.lab .opt{display:inline-block;margin-top:2px}

/* 리스트 줄 간격 (조건 요약 등) */
.lines{font-size:13.2px;line-height:1.75;color:var(--n700)}

/* 비버박스 */
.beaverbox{border:1px solid rgba(200,168,124,.35)}
.beaverbox p{text-wrap:pretty}

/* 모바일 미세 조정 */
body.mo .card.pad{padding:18px}
body.mo .foot{box-shadow:0 -6px 20px rgba(35,37,92,.05)}
body.mo .empty{padding:34px 22px}

/* 프레임 — 더 은은한 그림자 */
#frame{box-shadow:0 2px 8px rgba(28,37,71,.08),0 24px 60px rgba(28,37,71,.18)}
body.mo #frame{box-shadow:0 2px 8px rgba(28,37,71,.10),0 28px 64px rgba(28,37,71,.26)}

/* ═══ 전수점검 반영: 탭바 · 헤더 · 상태 · 스켈레톤 ═══ */
.tabbar{position:sticky;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--hair);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));flex:none}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;
  color:var(--n500);font-size:10.8px;font-weight:600;border-radius:12px;transition:color .15s,background .15s}
.tabbar a svg{width:21px;height:21px}
.tabbar a.on{color:var(--ind);font-weight:800}
.tabbar a:active{background:var(--n50)}

/* 클릭 가능한 스텝 (완료 단계로 되돌아가기) */
.rail a.step{cursor:pointer;border-radius:10px;margin:0 -8px;padding-left:8px;padding-right:8px;transition:background .15s}
.rail a.step:hover{background:var(--n50)}
.rail a.step:hover span:last-child{color:var(--n700)}

/* 상단 내비 — 스크롤 시 분리 */
.nav.solid{box-shadow:0 1px 0 var(--hair)}

/* 값이 입력된 필드는 조용히 표시 */
.inp:not(:placeholder-shown){border-color:#BFC0DE}

/* 선택 항목 개수 뱃지 */
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:var(--r-full);background:var(--ind);color:#fff;font-size:10.5px;font-weight:800;margin-left:6px}

/* 스켈레톤 (화면설계서: 스피너 금지) */
@keyframes shim{0%{background-position:-380px 0}100%{background-position:380px 0}}
.skel{background:linear-gradient(90deg,var(--n100) 8%,#F7F4EE 22%,var(--n100) 36%);
  background-size:760px 100%;animation:shim 1.3s linear infinite;border-radius:8px}

/* 링크 밑줄 오프셋 통일 */
#app a[style*="underline"]{text-underline-offset:3px;text-decoration-thickness:1px}

/* 카드 안 리스트 좌측 정렬 리듬 */
.kv dd{flex:1;min-width:0}

/* 모바일: 하단 고정 CTA와 탭바 동시 존재 방지 */
body.mo .foot + .tabbar{border-top:none}
</style>
</head>
<body class="pc">

<div id="bar">
  <span class="brand">비버노크 <span style="color:#6E70BC">프로토타입</span></span>
  <span class="tag">목데이터 · 실제 동작</span>
  <div class="grp" id="dev">
    <button data-dev="pc" class="on">PC 웹</button>
    <button data-dev="mo">모바일</button>
  </div>
  <div class="grp" id="role">
    <button data-go="#/" class="on">수요자</button>
    <button data-go="#/partner">공급자</button>
    <button data-go="#/ops">운영</button>
  </div>
  <select id="jump"></select>
  <span class="sp"></span>
  <span class="hint">입력한 값이 다음 화면에 그대로 반영됩니다</span>
  <button class="btn sm sec" id="reset" style="background:transparent;border-color:#2E3A62;color:#9AA3BF">초기화</button>
</div>

<div id="stage"><div id="frame"><div id="app"></div></div></div>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   비버노크 인터랙티브 프로토타입 — 단일 파일
   설계 근거: 화면설계서 v2.1 · 화면상세설계 v1.0 · 제안작성폼 v1.0
   ══════════════════════════════════════════════════════════ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = m => { if(!m) return '0'; const e=Math.floor(m/10000), r=m%10000;
  return e&&r ? `${e}억 ${r.toLocaleString()}만` : e ? `${e}억` : `${m.toLocaleString()}만`; };

/* ---------- 도메인 데이터 ---------- */
const ZONES = [
  {t:'미사강변도시', d:['미사1동','미사2동','미사3동']},
  {t:'원도심 · 신장 덕풍 천현', d:['신장1동','신장2동','덕풍1동','덕풍2동','덕풍3동','천현동']},
  {t:'위례 · 감일', d:['위례동','감일동','감북동','초이동']},
  {t:'그 외', d:['춘궁동','하남 어디든']},
];
const SHOP_ZONES = [
  {t:'미사강변도시', d:['미사역 상권','미사1동','미사2동','미사3동']},
  {t:'원도심', d:['하남시청역','신장동','덕풍동','스타필드 인근']},
  {t:'위례 · 감일', d:['위례동','감일동','하남 어디든']},
];
const BIZ = {

/* 5단계 매칭 — 유형 → 지역 → 예산(±10% 완충) → 필수키 → 필터
   기능정의서 4-2 · 데이터모델 v0.2 */
function matchStages(L, d){
  const m = d.m || {}, st = [];
  /* 1. 유형 */
  const kindOk = L.kind === d.kind && (L.kind==='shop' ? (!m.biz || m.biz===L.biz) : (!m.deal || m.deal===L.deal));
  st.push({k:'유형', ok:kindOk, note: L.kind==='shop' ? (m.biz||'') : (m.deal||'')});
  /* 2. 지역 */
  const norm = x => String(x).replace(/\s*(상권|전체)\s*/g,'');
  const regionOk = (m.dongs||[]).some(x => norm(x)===norm(L.dong));
  st.push({k:'지역', ok:regionOk, note:L.dong});
  /* 3. 예산 — ±10% 완충 · 관리비 포함 규칙 */
  let budOk = true, note = '';
  if(m.depMax != null){
    const depOk = L.dep <= m.depMax * 1.1;
    const eff = m.feeIncluded ? (L.rent||0) + (L.fee||0) : (L.rent||0);
    const rentOk = (m.rentMax == null) || eff <= m.rentMax * 1.1;
    budOk = depOk && rentOk;
    const over = L.dep > m.depMax || (m.rentMax != null && eff > m.rentMax);
    if(m.feeIncluded && L.fee) note = `관리비 포함 ${eff}`;
    if(budOk && over) note = (note?note+' · ':'') + '예산 약간 초과';
  }
  st.push({k:'예산', ok:budOk, note});
  /* 4. 필수키 — 주거: 방 수 / 상가: 면적·층 */
  let keyOk = true, keyNote = '';
  if(L.kind === 'home'){
    if(m.rooms != null){ keyOk = (L.rooms||0) >= m.rooms; keyNote = `${L.rooms}룸 (요청 ${m.rooms}룸+)`; }
  } else {
    const areaOk = (m.pyMin==null || L.py >= m.pyMin) && (m.pyMax==null || L.py <= m.pyMax);
    const fl = m.floors||[];
    const floorOk = !fl.length || fl.includes(L.band) || (fl.includes('2층 이상 가능') && L.band!=='지하');
    keyOk = areaOk && floorOk;
    keyNote = `${L.py}평 · ${L.band}`;
  }
  st.push({k:'필수', ok:keyOk, note:keyNote});
  /* 5. 필터 — 제외가 아니라 확인 체크리스트 (데이터모델 확정 규칙) */
  const want = (L.kind==='home' ? (m.musts||[]) : (m.fac||[]));
  const have = (L.kind==='home' ? (L.musts||[]) : (L.fac||[]));
  const miss = want.filter(x => !have.includes(x));
  st.push({k:'확인', ok:true, note: miss.length ? `확인 필요: ${miss.join(' · ')}` : '요청 항목 모두 충족', miss});
  return st;
}
/* 물건 → 맞는 수요 (슬롯 남고 미제안인 것만) */
/* 품질 점수 — 열람률 40% · 선택률 40% · 무신고 20% (S-09 공개 산식과 동일) */
function qualityScore(){
  const P=S.myprops, sent=P.length||1;
  const viewed=P.filter(p=>['viewed','selected','rejected'].includes(p.status)).length;
  const sel=P.filter(p=>p.status==='selected').length;
  const vr=viewed/sent, sr=viewed?sel/viewed:0, clean=1;
  return Math.round((vr*.4 + sr*.4 + clean*.2)*100);
}
function matchesFor(L){
  return S.demands.filter(d => d.slotsLeft>0 && !d.mine)
    .map(d => ({d, st: matchStages(L,d)}))
    .filter(x => x.st.slice(0,4).every(v => v.ok))
    .sort((a,b) => (a.st[4].miss.length - b.st[4].miss.length));
}
/* 수요 → 내 물건 중 맞는 것 */
function listingsFor(d){
  return S.listings.filter(L => L.status==='active')
    .map(L => ({L, st: matchStages(L,d)}))
    .filter(x => x.st.slice(0,4).every(v => v.ok));
}

   ※ 수요자에게 매물 "목록"을 보여주지 않는다 — 제안 안에서만 존재한다
      (공인중개사법 제18조의2 제3항). */
function proposalFromListing(L, condId, d, n){
  const st = matchStages(L, d), gap = st[4].miss || [];
  const ok = st.slice(0,4).filter(v=>v.ok).map(v=> v.k + (v.note?` (${v.note})`:''));
  return {
    id:'p'+Date.now()+n, cond:condId, demandId:d.id, isNew:true, read:false,
    photos:L.photos, title:L.name, dong:L.dong,
    dep:L.dep, rent:L.rent, fee:L.fee, feeType:'정액관리비',
    py:L.py, floor:L.band, parking:(L.musts||[]).includes('주차 가능')?'가능':'문의',

    diff: gap.length ? gap.map(g=>`${g} — 확인이 필요합니다`) : ['조건과 다른 점이 없습니다'],

  };
}

const WM_INK = m => m==="dark" ? "#FFFFFF" : m==="mono" ? "#1F1D1A" : "#3D3F8F";
const WM_SUB = m => m==="dark" ? "rgba(255,255,255,.5)" : m==="mono" ? "rgba(31,29,26,.45)" : "rgba(61,63,143,.42)";

/* A. 잔향 — 두드린 뒤 퍼지는 울림을 도트 3개로 */
function wmEcho(h,m){ const ink=WM_INK(m), ec=WM_SUB(m), d=Math.max(2.4,h*.115);
  return `<span style="display:inline-flex;align-items:center;gap:${h*.30}px;line-height:1">
    <b style="font-size:${h*.86}px;font-weight:800;letter-spacing:-.052em;color:${ink}">비버노크</b>
    <span style="display:inline-flex;align-items:center;gap:${d*.62}px">
      <i style="width:${d}px;height:${d}px;border-radius:50%;background:${ink};opacity:.9"></i>
      <i style="width:${d*.72}px;height:${d*.72}px;border-radius:50%;background:${ec}"></i>
      <i style="width:${d*.46}px;height:${d*.46}px;border-radius:50%;background:${ec};opacity:.6"></i>
    </span></span>`;}

/* B. 강세 — 이름의 동사부(노크)에 무게를 싣는다 */
function wmStress(h,m){ const ink=WM_INK(m), sub=m==="dark"?"rgba(255,255,255,.62)":m==="mono"?"rgba(31,29,26,.55)":"rgba(61,63,143,.55)";
  return `<b style="font-size:${h*.86}px;letter-spacing:-.052em;line-height:1;display:inline-block">
    <span style="font-weight:500;color:${sub}">비버</span><span style="font-weight:800;color:${ink}">노크</span></b>`;}

/* C. 타격 — 「노크」 밑에 짧고 굵은 타격선 하나 */
function wmStrike(h,m){ const ink=WM_INK(m);
  return `<b style="font-size:${h*.86}px;font-weight:800;letter-spacing:-.052em;line-height:1;color:${ink};display:inline-block">
    비버<span style="position:relative;display:inline-block">노크<i style="position:absolute;left:6%;right:16%;bottom:${-h*.17}px;height:${Math.max(2.4,h*.1)}px;background:${ink};border-radius:2px"></i></span></b>`;}

/* D. 문틀 — 모서리 브래킷 2개가 이름을 문처럼 감싼다 */
function wmFrame(h,m){ const ink=WM_INK(m), t=Math.max(1.8,h*.075), p=h*.30;
  return `<span style="position:relative;display:inline-block;padding:${p}px ${p*1.15}px">
    <i style="position:absolute;left:0;top:0;width:${h*.34}px;height:${h*.34}px;border-left:${t}px solid ${ink};border-top:${t}px solid ${ink}"></i>
    <i style="position:absolute;right:0;bottom:0;width:${h*.34}px;height:${h*.34}px;border-right:${t}px solid ${ink};border-bottom:${t}px solid ${ink}"></i>
    <b style="font-size:${h*.86}px;font-weight:800;letter-spacing:-.052em;line-height:1;color:${ink}">비버노크</b></span>`;}

/* 영문 1. 기본 — Beaver Knock (확정 표기) */
function wmEnCaps(h,m){ return `<b style="font-size:${h*.78}px;letter-spacing:-.012em;line-height:1;display:inline-block;white-space:nowrap">
    <span style="font-weight:700;color:${WM_LITE(m)}">Beaver&nbsp;</span><span style="font-weight:800;color:${WM_DEEP(m)}">Knock</span></b>`;}
/* 영문 2. 대문자 — 표지·배너처럼 크게 쓸 때만 */
function wmEnMixed(h,m){ return `<b style="font-size:${h*.58}px;letter-spacing:.09em;line-height:1;display:inline-block;white-space:nowrap">
    <span style="font-weight:700;color:${WM_LITE(m)}">BEAVER&nbsp;</span><span style="font-weight:800;color:${WM_DEEP(m)}">KNOCK</span></b>`;}
/* 영문 3. 압축 — 좁은 폭·앱스토어명 */
function wmEnShort(h,m){ return `<b style="font-size:${h*.70}px;letter-spacing:-.01em;line-height:1;display:inline-block;white-space:nowrap">
    <span style="font-weight:700;color:${WM_LITE(m)}">BVR&nbsp;</span><span style="font-weight:800;color:${WM_DEEP(m)}">Knock</span></b>`;}

/* ══════════ 워드마크 색상 규칙 (한글·영문 공통) ══════════
   「비버 / BEAVER」 = 연한 인디고 · 「노크 / KNOCK」 = 진한 인디고.
   이름의 동사부에 색과 무게를 함께 싣는다. */
const WM_DEEP = m => m==="dark" ? "#FFFFFF"              : m==="mono" ? "#1F1D1A"              : "#31336F";
const WM_LITE = m => m==="dark" ? "rgba(255,255,255,.58)": m==="mono" ? "rgba(31,29,26,.46)"   : "#9698CE";
const WM_EDGE = m => m==="dark" ? "rgba(255,255,255,.62)": m==="mono" ? "rgba(31,29,26,.5)"    : "#6E70BC";

/* 한글 — 모서리 브래킷(문틀) + 노크 타격선 */
function wmDoor(h, m, o){
  o = o || {};
  const deep = WM_DEEP(m), lite = WM_LITE(m);
  const bw  = Math.max(1.6, h * (o.bw  ?? .07));
  const bl  = h * (o.bl ?? .34);
  const pad = h * (o.pad ?? .30);
  const bc  = o.bcolor==="deep" ? deep : WM_EDGE(m);
  const lineOn = o.line !== false;
  const lw  = Math.max(2, h * (o.lw ?? .095));
  const from = o.full ? "0%" : "47%";
  return `<span style="position:relative;display:inline-block;padding:${pad}px ${pad*1.2}px">
    <i style="position:absolute;left:0;top:0;width:${bl}px;height:${bl}px;border-left:${bw}px solid ${bc};border-top:${bw}px solid ${bc}"></i>
    <i style="position:absolute;right:0;bottom:0;width:${bl}px;height:${bl}px;border-right:${bw}px solid ${bc};border-bottom:${bw}px solid ${bc}"></i>
    <span style="position:relative;display:inline-block">
      <b style="font-size:${h*.86}px;letter-spacing:-.052em;line-height:1;display:inline-block">
        <span style="font-weight:${o.flat?800:700};color:${lite}">비버</span><span style="font-weight:800;color:${deep}">노크</span></b>
      ${lineOn?`<i style="position:absolute;left:${from};right:0;bottom:${-h*.14}px;height:${lw}px;background:${deep};border-radius:${lw}px"></i>`:``}
    </span></span>`;}

const WM_DEV = [

const BURST_12 = "M50 2 L57.5 19 L74 9 L70 28 L89 26 L77 41 L96 50 L77 59 L89 74 L70 72 L74 91 L57.5 81 L50 98 L42.5 81 L26 91 L30 72 L11 74 L23 59 L4 50 L23 41 L11 26 L30 28 L26 9 L42.5 19 Z";

/* 노크 부분에 충격을 입힌 워드마크. kind: lines|burst|offset|outline|spark|shift|none */
function wmImpact(h, m, kind, o){
  o = o || {};
  const deep = WM_DEEP(m), lite = WM_LITE(m), edge = WM_EDGE(m);
  const soft = m==="dark" ? "rgba(255,255,255,.18)" : m==="mono" ? "rgba(31,29,26,.13)" : "rgba(110,112,188,.20)";

  if(kind==="outline") behind = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;left:${-h*.30}px;right:${-h*.30}px;top:${-h*.34}px;bottom:${-h*.34}px;width:auto;height:auto"><path d="${BURST_12}" fill="none" stroke="${edge}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  if(kind==="lines")   front  = `<span style="position:absolute;left:${-h*.30}px;top:${-h*.30}px;width:${h*.34}px;height:${h*.34}px">
      <svg viewBox="0 0 24 24" style="width:100%;height:100%"><g stroke="${deep}" stroke-width="2.6" stroke-linecap="round">
      <path d="M22 2 L14 10"/><path d="M12 1 L10 9"/><path d="M1 12 L9 10"/></g></svg></span>`;

      <svg viewBox="0 0 24 24" style="width:100%;height:100%"><path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4 Z" fill="${deep}"/></svg></span>`;

const TAGLINES = [

/* 워드마크 코어 — 브래킷 + 색 분리 */
function wmCore(h, m, noEn){
  const deep = WM_DEEP(m), lite = WM_LITE(m), edge = WM_EDGE(m);
  const bw = Math.max(1.4, h*.055), bl = h*.38, pad = h*.32;
  const enSize = h*.40;
  return `<span style="position:relative;display:inline-block;padding:${pad}px ${pad*1.1}px">
    <i style="position:absolute;left:0;top:0;width:${bl}px;height:${bl}px;border-left:${bw}px solid ${edge};border-top:${bw}px solid ${edge}"></i>
    <i style="position:absolute;right:0;bottom:0;width:${bl}px;height:${bl}px;border-right:${bw}px solid ${edge};border-bottom:${bw}px solid ${edge}"></i>
    <span style="display:inline-flex;flex-direction:column;align-items:center;gap:${(h*.11).toFixed(1)}px;line-height:1">
      <b style="font-size:${h*.86}px;letter-spacing:-.02em;line-height:1;display:block;white-space:nowrap">
        <span style="font-weight:700;color:${lite}">비버</span><span style="font-weight:800;color:${deep}">노크</span></b>
      ${noEn?``:`<span style="font-size:${enSize.toFixed(1)}px;letter-spacing:.05em;line-height:1;white-space:nowrap">
        <span style="font-weight:700;color:${lite}">Beaver</span> <span style="font-weight:800;color:${deep}">Knock</span></span>`}
    </span>
  </span>`;}

/* 가로 락업 — 확정안 D5 · 브래킷만 (2026-08-28)
   opt: {h, mode, partner, en(영문 병기), tag(태그라인), stack(세로)} */
function logoLockup(opt){
  const o = opt||{}, h = o.h||26, m = o.mode||"light";
  const sub = m==="dark" ? "rgba(255,255,255,.62)" : m==="mono" ? "rgba(31,29,26,.5)" : "var(--n500)";
  const rule = m==="dark" ? "rgba(255,255,255,.28)" : "var(--n300)";
  const tagEl = o.tag ? `<span style="font-size:${(h*.44).toFixed(1)}px;font-weight:600;letter-spacing:-.02em;color:${sub};white-space:nowrap">${esc(TAGLINE())}</span>` : '';
  const enEl  = '';
  const partEl= o.partner ? `<span style="font-size:${(h*.46).toFixed(1)}px;font-weight:700;letter-spacing:-.01em;color:${sub}">파트너</span>` : '';
  if(o.stack){
    return `<span style="display:inline-flex;flex-direction:column;align-items:flex-start;gap:${Math.round(h*.22)}px;line-height:1">
      <span style="display:inline-flex;align-items:center;gap:${Math.round(h*.28)}px">${wmCore(h,m,o.noEn)}${partEl}</span>
      ${o.en||o.tag?`<span style="display:inline-flex;align-items:center;gap:${Math.round(h*.30)}px;padding-left:${Math.round(h*.37)}px">${enEl}${o.en&&o.tag?`<i style="width:1px;height:${Math.round(h*.42)}px;background:${rule}"></i>`:''}${tagEl}</span>`:''}
    </span>`;}
  return `<span style="display:inline-flex;align-items:center;gap:${Math.round(h*.30)}px;line-height:1">
    ${wmCore(h,m,o.noEn)}${partEl}
    ${o.en||o.tag?`<i style="width:1px;height:${Math.round(h*.62)}px;background:${rule};flex:none"></i>`:''}
    ${enEl}${o.en&&o.tag?`<i style="width:1px;height:${Math.round(h*.42)}px;background:${rule};flex:none"></i>`:''}${tagEl}
  </span>`;}

/* 노크 장면 — 정면 비버의 든 손이 문을 향하도록 나란히 세운다.
   h = 비버 높이(px). 문은 비버보다 살짝 높다. */
function knockScene(h){
  /* 원본 아트 그대로 — 손동작과 노크 표시가 그림 안에 있으므로 덧붙이지 않는다 */
  return `<img src="${BEAVERLY_KNOCK}" alt="문을 두드리는 공인중개사 비버리"
    style="height:${h}px;width:auto;display:block;user-select:none;-webkit-user-drag:none">`;}

function beaverly(h){ return `<img src="${BEAVERLY_FRONT}" alt="공인중개사 비버리"
  style="height:${h||280}px;width:auto;display:block;user-select:none;-webkit-user-drag:none">`;}
/* 측면 — 이동/여정 장면 */
function beaverlySide(h){ return `<img src="${BEAVERLY_SIDE}" alt="공인중개사 비버리"
  style="height:${h||280}px;width:auto;display:block;user-select:none;-webkit-user-drag:none">`;}
/* 미니 — 안내 배지용 (정면을 작게) */
function beaverlyMini(h){ return `<img src="${BEAVERLY_FRONT}" alt=""
  style="height:${h||56}px;width:auto;display:block;flex:none;user-select:none;-webkit-user-drag:none">`;}

const ICON_PHOTO = `<svg viewBox="0 0 24 24" fill="none" stroke="#6E70BC" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M3 16 L9 11 L14 15 L17 13 L21 16"/></svg>`;

/* 모바일 하단 탭바 — 수요자/공급자 각각 */
function tabbar(active, role){
  if(!isMo()) return '';
  const items = role==='p'
    ? [['#/partner/demands','수요','d'],['#/partner/listings','내 물건','l'],['#/partner/proposals','내 제안','p'],['#/partner/settings','설정','s']]
    : [['#/','홈','home'],['#/my','내 조건','my'],['#/inbox','제안함','inbox']];
  const ico = {
    home:'M4 11 L12 4 L20 11 M6.5 9.5 V19 h11 V9.5',
    my:'M5 5 h14 M5 12 h14 M5 19 h9',
    inbox:'M3 12 h5 l2 3 h4 l2 -3 h5 M3 12 V7 a2 2 0 0 1 2 -2 h14 a2 2 0 0 1 2 2 v5 M3 12 v5 a2 2 0 0 0 2 2 h14 a2 2 0 0 0 2 -2 v-5',
    d:'M4 6 h16 M4 12 h16 M4 18 h10', p:'M5 4 h9 l5 5 v11 H5 Z M14 4 v5 h5',
    l:'M4 11 L12 4 L20 11 M6.5 9.5 V19 h11 V9.5 M10 19 v-5 h4 v5',
    s:'M12 15.5 a3.5 3.5 0 1 0 0 -7 a3.5 3.5 0 0 0 0 7 M12 2 v3 M12 19 v3 M2 12 h3 M19 12 h3 M5 5 l2 2 M17 17 l2 2 M19 5 l-2 2 M7 17 l-2 2'
  };
  return `<nav class="tabbar">${items.map(([href,label,k])=>{
    const on = active===k;
    return `<a data-go="${href}" class="${on?'on':''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${on?2.2:1.8}" stroke-linecap="round" stroke-linejoin="round"><path d="${ico[k]}"/></svg>
      <span>${label}</span></a>`;}).join('')}</nav>`;
}

/* ---------- 조건 요약 생성 ---------- */
function draftTitle(d){
  if(d.kind==='shop') return `${d.dongs[0]||'하남'}${d.dongs.length>1?' 외 '+(d.dongs.length-1):''} · ${d.biz||'상가'}${d.areaMin?` · ${d.areaMin}~${d.areaMax||''}평`:''}`;
  const rooms = d.rooms && d.rooms!=='무관' ? ` · ${d.rooms}` : '';
  return `${d.dongs.slice(0,2).join('·')||'하남'}${d.dongs.length>2?' 외':''} · ${d.deal||'전월세'}${rooms}`;
}
function draftLines(d){
  const L=[];
  if(d.kind==='shop'){
    L.push(`보증금 ${won(+d.dep||0)} / 월 ${d.rent||0}${d.key?` · 권리금 ${won(+d.key)}까지`:''}`);
    if(d.areaMin) L.push(`전용 ${d.areaMin}~${d.areaMax||''}평 (${(d.areaMin*3.305785).toFixed(1)}~${d.areaMax?(d.areaMax*3.305785).toFixed(1):''}㎡)${d.shopFloorFree?` · ${d.shopFloorFree}`:''}`);
    else if(d.shopFloorFree) L.push(d.shopFloorFree);
    if(d.facFree) L.push(`설비 — ${d.facFree}`);
  } else {
    L.push(`보증금 ${won(+d.dep||0)}${+d.rent?` / 월 ${d.rent}`:''}`);
    L.push(`${d.htype.join(' · ')||'유형 무관'}${d.when?` · ${d.when} 입주`:''}`);
    if(d.musts.length) L.push(d.musts.join(' · '));
  }
  if(d.floor) L.push(d.floor);
  return L.filter(Boolean);
}
function detailPct(d){
  /* 선택 항목은 유형마다 다르다 — 상가에 '거주 인원'을 묻지 않는다 */
  const opt = d.kind==='shop' ? ['memo','openWhen','keyOk','signNeed'] : ['memo','floor','house','elev','loan'];
  let n=0; opt.forEach(k=>{ if(d[k]) n++; });
  return Math.round(40 + (n/opt.length)*60);
}

/* ── 투영 · 기하 ── */
const GEO_K = Math.cos(37.5 * Math.PI/180);
const pj = (lng,lat) => [lng*GEO_K, -lat];

function bboxOf(pts){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(p=>{ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); });
  return {x0,y0,x1,y1}; }

/* 반평면 자르기 — 볼록 클립이라 Sutherland–Hodgman이 정확하다 */
function clipHalf(poly, mx, my, dx, dy){
  const f = p => (p[0]-mx)*dx + (p[1]-my)*dy;
  const out = [];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length], fa=f(a), fb=f(b);
    if(fa<=0) out.push(a);
    if((fa<=0)!==(fb<=0)){ const t=fa/(fa-fb); out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); }
  }
  return out;
}
/* 보로노이 — 셀 수가 적어 O(n²) 반평면 절단으로 충분하다 */
function voronoi(sites, bb){
  const pad = 0.02;
  const rect = [[bb.x0-pad,bb.y0-pad],[bb.x1+pad,bb.y0-pad],[bb.x1+pad,bb.y1+pad],[bb.x0-pad,bb.y1+pad]];
  return sites.map((a,i)=>{
    let poly = rect;
    for(let j=0;j<sites.length && poly.length;j++){
      if(i===j) continue;
      const b=sites[j];
      poly = clipHalf(poly, (a.px+b.px)/2, (a.py+b.py)/2, b.px-a.px, b.py-a.py);
    }
    return poly;
  });
}

/* ── 장면 하나를 통째로 그린다 ── */
const MAP_W = 720, MAP_H = 600;
function mapScene(level, sel, shop){
  let sites, outline, sub2 = null;
  if(level==='seoul'){ sites = SEOUL_GU; outline = OUT_SEOUL; }
  else if(level==='hanam'){ sites = shop ? HANAM_ZONE : HANAM_DONG; outline = OUT_HANAM; }
  else { sites = [...SEOUL_GU, ...GG_SI]; outline = OUT_KYUNGGI; }

  const op = outline.map(p=>pj(p[0],p[1]));
  const bb = bboxOf(op);
  const sc = Math.min(MAP_W/(bb.x1-bb.x0), MAP_H/(bb.y1-bb.y0)) * 0.94;
  const ox = (MAP_W - (bb.x1-bb.x0)*sc)/2, oy = (MAP_H - (bb.y1-bb.y0)*sc)/2;
  const T = p => [ (p[0]-bb.x0)*sc + ox, (p[1]-bb.y0)*sc + oy ];
  const G = (lng,lat) => T(pj(lng,lat));
  const d = pts => pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')+'Z';
  const line = pts => pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');

  const S2 = sites.map(x=>{ const p=pj(x.lng,x.lat); return {...x, px:p[0], py:p[1]}; });
  const cells = voronoi(S2, bb).map(c=>c.map(T));

  const topLevel = level==='top';
  const isSeoulSite = i => topLevel && i < SEOUL_GU.length;

  /* 셀 */
  const body = S2.map((x,i)=>{
    if(!cells[i] || cells[i].length<3) return '';
    const on = sel.includes(x.t);
    const seoulBlock = isSeoulSite(i);
    const drill = seoulBlock ? 'seoul' : (topLevel && x.t==='하남시' ? 'hanam' : null);
    const act = drill ? `data-act="map-drill" data-v="${drill}"` : `data-act="dong" data-v="${esc(x.t)}"`;
    const fill = on ? 'var(--ind)' : seoulBlock ? '#E7E4F2' : (topLevel && x.t==='하남시') ? 'var(--clay100)' : 'var(--white)';
    const stroke = on ? 'var(--ind)' : seoulBlock ? '#D6D2E8' : 'var(--n300)';
    return `<path class="mapcell" ${act} d="${d(cells[i])}" fill="${fill}" stroke="${stroke}" stroke-width="${seoulBlock?0.7:1.1}"/>`;
  }).join('');

  /* 라벨 */
  const labels = S2.map((x,i)=>{
    if(isSeoulSite(i)) return '';
    if(!cells[i] || cells[i].length<3) return '';
    const on = sel.includes(x.t);
    /* 보로노이 셀은 볼록하므로 무게중심이 항상 셀 안에 있다 — 라벨이 밖으로 새지 않는다 */
    const cx = cells[i].reduce((t,q)=>t+q[0],0)/cells[i].length;
    const cy = cells[i].reduce((t,q)=>t+q[1],0)/cells[i].length;
    const p = [cx, cy];
    /* 작은 셀은 글자를 줄여 옆 라벨과 부딪히지 않게 한다 */
    const ar = Math.abs(cells[i].reduce((t,p,k)=>{const q=cells[i][(k+1)%cells[i].length]; return t+p[0]*q[1]-q[0]*p[1];},0))/2;
    const fs = level==='top' ? (ar<1400 ? 8 : ar<3000 ? 9 : 10) : x.t.length>=6 ? 11 : 12.5;
    return `<text x="${p[0].toFixed(1)}" y="${(p[1]+fs*0.35).toFixed(1)}" text-anchor="middle" font-size="${fs}"
      font-weight="${on?800:600}" fill="${on?'#fff':'var(--n700)'}" paint-order="stroke"
      stroke="${on?'transparent':'rgba(255,255,255,.92)'}" stroke-width="3">${esc(x.t)}</text>`;
  }).join('');

  const seoulLabel = topLevel ? (()=>{ const p=G(126.985,37.540);
    return `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" text-anchor="middle" font-size="14" font-weight="800"
      fill="#5C57A6" paint-order="stroke" stroke="rgba(255,255,255,.95)" stroke-width="4">서울특별시</text>
      <text x="${p[0].toFixed(1)}" y="${(p[1]+13).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700"
      fill="#8B86C4" paint-order="stroke" stroke="rgba(255,255,255,.95)" stroke-width="3">눌러서 구 고르기</text>`;})() : '';

  const incheon = topLevel ? (()=>{ const p=OUT_INCHEON.map(q=>G(q[0],q[1])); const c=G(126.638,37.468);
    return `<path d="${d(p)}" fill="#EDEAE4" stroke="#DDD8CE" stroke-width="1" data-act="map-na" data-v="인천광역시" style="cursor:not-allowed"/>
      <text x="${c[0].toFixed(1)}" y="${c[1].toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#A9A296">인천</text>
      <text x="${c[0].toFixed(1)}" y="${(c[1]+12).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#B9B2A6">준비 중</text>`;})() : '';

  const river = `<path d="${line(HANGANG.map(q=>G(q[0],q[1])))}" fill="none" stroke="#9EC3E0"
    stroke-width="${level==='top'?4:7}" stroke-linecap="round" stroke-linejoin="round" opacity=".85" pointer-events="none"/>`;

  const border = `<path d="${d(op.map(p=>T(p)))}" fill="none" stroke="var(--n500)" stroke-width="1.8" opacity=".5" pointer-events="none"/>`;

  /* 현재 위치 표시 */
  const here = S.geo && S2.some(x=>x.t===S.geo.t) ? (()=>{ const p=G(S.geo.lng, S.geo.lat);
    return `<g pointer-events="none"><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="11" fill="var(--clay)" opacity=".25"/>
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--clay700)" stroke="#fff" stroke-width="2"/></g>`;})() : '';

  const clipId = 'clip-'+level;
  return `
  <svg class="map" viewBox="0 0 ${MAP_W} ${MAP_H}" role="group" aria-label="지역 선택 지도">
    <defs><clipPath id="${clipId}"><path d="${d(op.map(p=>T(p)))}"/></clipPath></defs>
    <rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="#F2F5F7"/>
    <g clip-path="url(#${clipId})">${body}</g>
    ${border}${river}${incheon}${labels}${seoulLabel}${here}
  </svg>`;
}

/* ── 위치 확인 ── */
function detectRegion(manual){
  if(!navigator.geolocation){ S.geoState='unavailable'; if(manual) toast('이 브라우저에서는 위치를 쓸 수 없습니다'); render(); return; }
  S.geoState='asking'; render();
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude, ln=p.coords.longitude;
    const all=[...SEOUL_GU.map(x=>({...x,lv:'seoul'})), ...GG_SI.map(x=>({...x,lv:'gg'}))];
    let best=all[0], bd=Infinity;
    all.forEach(x=>{ const dd=(x.lat-la)**2 + ((x.lng-ln)*GEO_K)**2; if(dd<bd){bd=dd; best=x;} });
    S.geo=best; S.geoState='ok';
    S.draft.mapLevel = best.lv==='seoul' ? 'seoul' : best.t==='하남시' ? 'hanam' : 'top';
    toast(`${best.t} 근처로 지도를 맞췄습니다`); render();
  }, err=>{ S.geoState = err.code===1 ? 'denied' : 'unavailable';
    if(manual) toast(err.code===1?'위치 권한이 거부되어 있습니다':'위치를 확인하지 못했습니다');
    render();
  }, {timeout:8000, maximumAge:600000, enableHighAccuracy:false});
}

   여기서는 그 절차를 그대로 흉내 낸 목업이다. 두 수단 모두 이름과 연락처를 함께 회신한다. */
const VMETHODS = [

  {k:'pass', t:'PASS 인증',     d:'PASS 앱에서 지문·비밀번호로 확인합니다', s:'앱에서 한 번만 누르면 끝납니다'},
];
const CARRIERS = ['SKT','KT','LG U+','알뜰폰'];
const phoneOk = p => /^01[016789][0-9]{7,8}$/.test(String(p).replace(/-/g,''));
const fmtPhone = p => { const n=String(p).replace(/-/g,'');
  return n.length>=10 ? n.replace(/^(01[016789])([0-9]{3,4})([0-9]{4})$/,'$1-$2-$3') : n; };
const maskPhone = p => { const n=String(p).replace(/-/g,'');
  return n.length>=10 ? fmtPhone(n).replace(/-([0-9]{3,4})-/,'-****-') : n; };

    ${sub?`<span style="display:block;font-size:11.8px;font-weight:700;color:${avg==null?'var(--n500)':avg?'var(--ok)':'var(--warn)'}">${sub}</span>`:''}</div>`;
  return `
<div class="scr fade" style="background:var(--n50)">
  ${navPartner('st')}
  <div class="pad" style="flex:1;padding-top:${isMo()?18:30}px;padding-bottom:26px;max-width:${isMo()?'none':'1000px'};margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px">

      ${tile('8월 제안', sent+'건', '발송 기준', null)}
      ${tile('열람률', vr+'%', `전체 평균 54%${vr>54?' 보다 높음':' 보다 낮음'}`, vr>54)}
      ${tile('선택률', sr+'%', `전체 평균 11%${sr>11?' 보다 높음':' 보다 낮음'}`, sr>11)}
      ${tile('내 노출 순위', '상위 30%', '품질 점수 기준', null, true)}

          ${[['열람률','40%','제안 열람 수 ÷ 발송 수'],['선택률','40%','연결 수 ÷ 열람 수'],['신고·반려','20%','무신고 가점 · 허위 신고 확정 시 큰 감점']]

   RLS 가 INSERT 만 허용하고 SELECT 정책이 없어 누구도 남의 조건을 읽지 못한다.
   (실측 확인: 행이 있는 상태에서도 조회 결과가 빈 배열) */
const BK = {
  url:   'https://gmbtsucasfwqskfvugzo.supabase.co',

/* 화면의 draft 를 테이블 컬럼으로 옮긴다. 화면에서 지운 항목은 보내지 않는다. */
function demandPayload(d, slotN){
  const n  = v => { const x = parseFloat(String(v).replace(/[^0-9.]/g,'')); return isFinite(x) ? x : null; };
  const i  = v => { const x = parseInt(String(v).replace(/[^0-9]/g,''), 10); return isFinite(x) ? x : null; };
  const t  = v => { const x = String(v ?? '').trim(); return x || null; };
  const shop = d.kind === 'shop';
  return {
    kind: d.kind, who: d.kind,
    dongs: d.dongs,
    deal: shop ? null : t(d.deal),
    dep: i(d.dep), rent: i(d.rent), fee_included: true,
    key_money: shop ? i(d.key) : null,

    htype: shop ? [] : (d.htype || []),
    rooms: shop ? null : t(d.rooms),
    when_text: shop ? null : (d.when === '직접 입력' ? t(d.whenFree) : t(d.when)),
    musts: shop ? [] : (d.musts || []),
    must_free: shop ? null : t(d.mustFree),
    floor_avoid: shop ? null : t(d.floor),
    household: shop ? null : t(d.house),
    elevator: shop ? null : t(d.elev),
    loan_plan: shop ? null : t(d.loan),

    biz: shop ? t(d.biz) : null,
    area_min: shop ? n(d.areaMin) : null,
    area_max: shop ? n(d.areaMax) : null,
    shop_floor_free: shop ? t(d.shopFloorFree) : null,
    facilities_free: shop ? t(d.facFree) : null,
    key_ok: shop ? t(d.keyOk) : null,
    sign_need: shop ? t(d.signNeed) : null,
    park_need: shop ? i(d.parkNeed) : null,
    shop_note: shop ? t(d.shopNote) : null,
    open_when: shop ? t(d.openWhen) : null,

    memo: t(d.memo),

    name: String(d.name || '').trim(),
    phone: String(d.phone || '').replace(/-/g, ''),
    birth: t(d.birth),
    verify_method: d.vmethod || null,
    verified_at: d.verified ? new Date().toISOString() : null,

    contact_pref: t(d.pref),
    contact_times: d.times || [],

    agree_third_party: !!d.a1,
    agree_multi_alert: !!d.a2,
    agree_marketing: !!d.a3,

    slots: slotN, slots_left: slotN,
    source: location.hostname || 'local',
    user_agent: (navigator.userAgent || '').slice(0, 300),
  };
}

/* 저장은 화면을 막지 않는다 — 결과는 나중에 토스트로만 알린다 */
function saveDemand(d, slotN){
  let body;
  try { body = JSON.stringify(demandPayload(d, slotN)); }
  catch(e){ console.warn('조건 변환 실패', e); return; }
  fetch(`${BK.url}/rest/v1/${BK.table}`, {
    method:'POST',
    headers:{ apikey:BK.key, Authorization:'Bearer '+BK.key,
              'Content-Type':'application/json', Prefer:'return=minimal' },
    body,
  }).then(r=>{
    if(r.ok){ S.saved = true; return; }
    return r.text().then(txt=>{ console.warn('조건 저장 실패', r.status, txt);
      toast('조건은 화면에 남았지만 서버 저장에 실패했습니다'); });
  }).catch(e=>{ console.warn('조건 저장 실패', e);
    toast('네트워크 문제로 서버 저장에 실패했습니다'); });
}


/* ══════════ A-05 운영 조회 (실데이터) ══════════
   조회는 /api/demands 가 서비스 키로 대신 한다. 이 화면은 암호만 들고 있는다.
   암호는 메모리에만 둔다 — 새로고침하면 다시 물어본다. */
const OPS = { pass:'', rows:null, loading:false, err:'', reveal:false, kind:'', days:0, at:'' };

function opsFetch(){
  if(OPS.loading) return;
  OPS.loading = true; OPS.err = ''; render();
  /* 암호는 본문에 담는다 — 헤더는 latin-1 만 가능해 한글 암호를 못 싣는다 */
  fetch('/api/demands', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({pass:OPS.pass, limit:300, kind:OPS.kind||undefined,
                          days:OPS.days||undefined, reveal:OPS.reveal}),
  })
    .then(async r=>{
      const j = await r.json().catch(()=>({error:'응답을 읽지 못했습니다'}));
      if(!r.ok){ OPS.err = j.error || ('오류 '+r.status); OPS.rows = null;
        if(j.need) OPS.err += ' — 미설정: '+j.need.join(', '); return; }
      OPS.rows = j.rows; OPS.at = j.fetchedAt;
    })
    .catch(e=>{ OPS.err = '서버에 닿지 못했습니다 — ' + String(e).slice(0,80); OPS.rows = null; })
    .finally(()=>{ OPS.loading = false; render(); });
}

function opsCsv(){
  if(!OPS.rows || !OPS.rows.length) return toast('내려받을 자료가 없습니다'), true;
  const cols = ['created_at','kind','name','phone','dongs','deal','dep','rent','biz',
                'area_min','area_max','when_text','open_when','memo','verify_method','source'];
  const esc2 = v => `"${String(Array.isArray(v)?v.join(' · '):(v??'')).replace(/"/g,'""')}"`;
  const csv = [cols.join(',')].concat(OPS.rows.map(r=>cols.map(c=>esc2(r[c])).join(','))).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `비버노크_조건_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  return true;
}

/* ══════════ 라우터 ══════════ */
function render(){
  let h = location.hash || '#/';
  /* 딥링크 가드: 선행 단계를 건너뛴 진입을 앞 단계로 되돌린다 */
  if((h==='#/register'||h==='#/detail'||h==='#/contact') && !S.draft.kind){ location.replace('#/kind'); return; }
  /* 내 정보 영역은 로그인이 필요하다 — 조건 등록 자체는 둘러보기로 열어둔다 */
  const MINE = h==='#/my' || h==='#/inbox' || h.startsWith('#/proposal/') || h.startsWith('#/connect/') || h.startsWith('#/report/');
  if(MINE && !S.user){ S.afterLogin = h; location.replace('#/login'); return; }
  if(h.startsWith('#/partner/propose/') && S.timeLeft<=0){ S.timeLeft = 900; }
  S.route = h;
  const parts = h.split('/');
  let html;
  if(h.startsWith('#/proposal/')) html = V['#/proposal'](parts[2]);
  else if(h.startsWith('#/connect/')) html = V['#/connect'](parts[2]);
  else if(h.startsWith('#/report/')) html = V['#/report'](parts[2]);
  else if(h.startsWith('#/partner/demand/')) html = V['#/partner/demand'](parts[3]);
  else if(h.startsWith('#/partner/propose/')) html = V['#/partner/propose'](parts[3]);
  else if(h==='#/partner/join') html = V['#/partner/join']();
  else if(h==='#/partner/stats') html = V['#/partner/stats']();
  else if(h==='#/partner/settings') html = V['#/partner/settings']();
  else if(h==='#/partner/listing/new') html = V['#/partner/listing/new']();
  else if(h.startsWith('#/partner/listing/')) html = V['#/partner/listing'](parts[3]);
  else html = (V[h] || V['#/'])();
  $('#app').innerHTML = html + modalHTML();
  $('#app').scrollTop = 0;
  // 툴바 역할 하이라이트
  $$('#role button').forEach(b=>{ const t=b.dataset.go;
    b.classList.toggle('on', t==='#/ops'? h.startsWith('#/ops') : t==='#/partner'? h.startsWith('#/partner') : (!h.startsWith('#/partner') && !h.startsWith('#/ops'))); });
  $('#jump').value = h;
  // 슬롯 타이머
  if(h.startsWith('#/partner/propose/')) startTimer(); else stopTimer();
  /* 지역을 고르는 화면에 처음 들어올 때만 위치를 한 번 확인한다 */
  if(h==='#/register' && !S.geoTried){ S.geoTried=true; setTimeout(()=>detectRegion(false), 400); }
  if(!(h==='#/contact' && S.draft.vstep==='code')) stopVTimer();
}
function startTimer(){ if(S.timer) return;
  S.timer=setInterval(()=>{ S.timeLeft=Math.max(0,S.timeLeft-1);
    const el=$('#app .badge.num'); if(el){const m=String(Math.floor(S.timeLeft/60)).padStart(2,'0'),s=String(S.timeLeft%60).padStart(2,'0');
      el.textContent=`슬롯 예약 ${m}:${s}`; if(S.timeLeft<180){el.style.background='var(--dangerbg)';el.style.color='var(--danger)';}}
    if(S.timeLeft===0){ stopTimer(); toast('시간이 지나 슬롯을 반환했습니다 · 작성 내용은 저장돼 있습니다'); render(); }
  },1000);}
function stopTimer(){ if(S.timer){clearInterval(S.timer); S.timer=null;} }

/* 본인확인 문자 유효시간 — 화면을 통째로 다시 그리면 입력 포커스가 날아가므로
   타이머 표시만 직접 갈아끼운다 */
function startVTimer(){ if(S.vtimer) return;
  S.vtimer=setInterval(()=>{ S.vsec=Math.max(0,S.vsec-1);

    if(el){ el.textContent=`${String(Math.floor(S.vsec/60)).padStart(2,'0')}:${String(S.vsec%60).padStart(2,'0')}`;

  },1000);}
function stopVTimer(){ if(S.vtimer){clearInterval(S.vtimer); S.vtimer=null;} }
function verifyDone(d){

document.addEventListener('click', e=>{
  const goEl = e.target.closest('[data-go]');
  const actEl = e.target.closest('[data-act]');
  if(actEl){ const a=actEl.dataset.act, v=actEl.dataset.v;
    if(a==='modal-bg' && e.target.closest('[data-stop]')) return;
    if(handle(a,v,actEl)) { e.preventDefault(); return; } }
  if(goEl){ e.preventDefault();
    if(goEl.dataset.cond) S.inboxCond=goEl.dataset.cond;
    go(goEl.dataset.go); }
});
document.addEventListener('input', e=>{
  const el=e.target.closest('[data-in]'); if(!el) return;
  const k=el.dataset.in, v=el.value;
  if(k.startsWith('j-')){ S.form[k]=v; render(); return; }
  if(k.startsWith('sc-')){ S.scope[k.slice(3)] = v; render(); return; }
  if(k.startsWith('l') && S.route.startsWith('#/partner/listing')){ S.form[k]=v; refreshListingBtn(); return; }
  if(['addr','bname','area','areaSup','dep','rent','fee','feeItems','approved','rooms','baths','floorNo','msg'].includes(k) && S.route.startsWith('#/partner/propose')){
    S.form[k]= k==='msg'? v.slice(0,200) : v;
    if(k==='msg'){ const c=$('#app [data-msgcount]'); if(c) c.textContent=`${S.form.msg.length}/200`; }
    refreshChecks(); return;
  }
  if(k==='reportDetail'){ S.form.reportDetail=v; return; }
  if(k==='email'||k==='pw'||k==='pw2'){ S[k]=v; refreshLoginBtn(); return; }

function refreshListingBtn(){

function refreshChecks(){
  if(!S.route.startsWith('#/partner/propose')) return;
  const f=S.form, g=k=>f[k]||'';
  const floorOk = f.floorMode==='비공개' || (f.floorMode==='정확한 층'? !!f.floorNo : f.floorMode==='고·중·저'? !!f.band : false);
  const checks=[['소재지',!!g('addr').trim()],['건물명',!!g('bname').trim()],['면적',+g('area')>0],['가격',+g('dep')>0],
    ['거래형태',true],['방/욕실',!!g('rooms')&&!!g('baths')],['입주가능일',!!g('moveIn')],['방향',!!g('dir')],
    ['관리비',g('fee')!==''&&!!g('feeType')],['층 표기',floorOk],['공급면적',+g('areaSup')>0],['주차장',!!g('park')]];
  const passed=checks.filter(c=>c[1]).length, allOk=passed===checks.length;
  const panel=$('#app [data-checks]');
  if(panel) panel.innerHTML = checks.map(([k,ok])=>`<span style="font-size:12.4px;font-weight:600;color:${ok?'var(--ok)':'var(--danger)'}">${ok?'✓':'✕'} ${k}</span>`).join('');
  const cnt=$('#app [data-checkcount]');
  if(cnt){ cnt.textContent=`${allOk?'모두 충족':'충족'} (${passed}/12)`; cnt.style.color = allOk?'var(--ok)':'var(--n500)'; }
  const btn=$('#app [data-act="send-proposal"]'); if(btn) btn.disabled = !(allOk && S.timeLeft>0);
  /* 면적 평 병기 — 중개사 회신: 공급면적이 가장 중요하고 평으로 같이 봐야 한다 */
  ['areaSup','area'].forEach(k=>{ const el=$(`#app [data-py="${k}"]`);
    if(el) el.textContent = +g(k)>0 ? `${(+g(k)/3.305785).toFixed(1)}평` : ''; });
}

    case 'ldong': case 'lbiz': case 'ldeal': case 'lband':
      S.form[a] = S.form[a]===v ? '' : v; render(); return true;
    case 'lfac': case 'lmusts': { S.form[a]=S.form[a]||[]; toggleIn(S.form[a], v); render(); return true; }
    case 'llookup': { if(!(S.form.laddr||'').trim()) return toast('주소를 입력해 주세요'), true;
      S.form.lfilled=true;
      S.form.lname = S.form.lname || (S.form.laddr.includes('미사')?'미사강변 ○○아파트':'○○빌라');
      S.form.lpy = S.form.lpy || '24.2';
      if(!S.form.ldong) S.form.ldong = S.form.laddr.includes('미사')?'미사1동':'덕풍2동';
      toast('건축물대장에서 자동으로 채웠습니다'); render(); return true; }
    case 'save-listing': {
      const f=S.form, shop=f.lkind==='shop';
      const L={ id:'L'+Date.now(), kind: shop?'shop':'home', name:(f.lname||'').trim(), dong:f.ldong,
        deal: shop?undefined:(f.ldeal||'월세'), biz: shop?f.lbiz:undefined,
        dep:+f.ldep||0, rent:+f.lrent||0, fee:+f.lfee||0, py:+f.lpy||0,
        rooms:+f.lrooms||0, baths:0, band:f.lband||(shop?'1층만':'중층'), floors:0,
        musts:f.lmusts||[], fac:f.lfac||[], moveIn:'협의', photos:0, at:'방금', status:'active' };
      S.listings.unshift(L);
      const n=matchesFor(L).length;
      S.form={};
      go('#/partner/listing/'+L.id);
      toast(n? `등록 완료 — 맞는 손님 ${n}명을 찾았습니다` : '등록 완료 — 맞는 손님이 오면 알려드립니다');
      return true; }
    case 'del-listing': { S.listings=S.listings.filter(x=>x.id!==v); toast('물건을 내렸습니다'); go('#/partner/listings'); return true; }
    case 'propose-with': { const [lid,did]=v.split('|'); const L=S.listings.find(x=>x.id===lid); const d=S.demands.find(x=>x.id===did);
      if(!L||!d) return true;
      const st=matchStages(L,d);
      S.form={ ptab:S.form.ptab, photos:L.photos, filled:true, addr:L.name, bname:L.name,
        area:(L.py*3.305785).toFixed(1), dep:String(L.dep), rent:String(L.rent), fee:String(L.fee),
        feeType:'정액관리비', rooms:String(L.rooms||''), baths:String(L.baths||1),
        floorMode:'고·중·저', band:L.band==='1층만'?'저층':L.band, moveIn:'협의', dir:'남동',
        fromListing:L.id,
        msg: st[4].miss.length
          ? `요청하신 조건 중 지역·예산·${L.kind==='home'?'방수':'면적'}는 맞습니다. ${st[4].miss.join('·')}은(는) 확인이 필요합니다 — 솔직히 말씀드립니다.`
          : `요청하신 조건에 모두 맞는 물건입니다. ${L.name}, ${priceOf(L)}. 바로 보여드릴 수 있습니다.` };
      S.timeLeft=900; go('#/partner/propose/'+d.id);
      toast('물건 정보를 불러왔습니다 — 확인 후 보내세요'); return true; }
    case 'withdraw': { const p=S.myprops.find(x=>x.id===v); p.status='withdrawn'; p.reason='회수하셨습니다 · 슬롯 반환됨';
      toast('회수했습니다 · 슬롯이 반환됐습니다'); render(); return true; }
  }
  return false;
}

/* 모바일 조건 선택 셀렉트 */
document.addEventListener('change', e=>{
  const s=e.target.closest('[data-act="pick-cond-sel"]'); if(s){ S.inboxCond=s.value; render(); }
});

/* 툴바 */
$('#dev').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  S.device=b.dataset.dev; document.body.className=S.device;
  $$('#dev button').forEach(x=>x.classList.toggle('on', x===b)); render(); });
$('#reset').addEventListener('click', ()=>{ Object.assign(S,{draft:blankDraft(),
  conds:JSON.parse(JSON.stringify(SEED_CONDS)), props:JSON.parse(JSON.stringify(SEED_PROPOSALS)),
  demands:JSON.parse(JSON.stringify(SEED_DEMANDS)), listings:JSON.parse(JSON.stringify(SEED_LISTINGS)),
  scope:JSON.parse(JSON.stringify(SCOPE_DEFAULT)),
  myprops:JSON.parse(JSON.stringify(SEED_MYPROP)),
  inboxCond:'c1', form:{}, modal:null, safeNo:null, timeLeft:900, matched:0, sentAddr:{}, vsec:180,
  user:null, afterLogin:null, loginTab:'sns', email:'', pw:'', pw2:'', signup:false,
  geo:null, geoState:'idle', geoTried:false});
  stopVTimer();
  toast('처음 상태로 되돌렸습니다'); go('#/'); render(); });

const ROUTES=[['#/','D-01 랜딩'],['#/login','D-00 로그인'],['#/kind','D-02 유형 선택'],['#/register','D-03 조건 등록'],['#/detail','D-06 상세 보강'],
  ['#/contact','D-04 연락·동의'],['#/done','D-05 접수 완료'],['#/my','D-07 내 조건'],['#/inbox','D-08 제안함'],
  ['#/proposal/p1','D-09 제안 상세'],['#/connect/p1','D-10 연결'],['#/report/p1','D-11 신고'],['#/relax','D-12 조건 완화'],
  ['#/partner','S-01 공급자 랜딩'],['#/partner/demands','S-04 수요 목록'],['#/partner/demand/d1','S-05 수요 상세'],
  ['#/partner/propose/d1','S-06 제안 작성'],['#/partner/join','S-02 가입·인증'],['#/partner/settings','S-03 활동 조건 설정'],['#/partner/listings','S-08 내 물건'],['#/partner/listing/L1','S-08 역매칭 결과'],['#/partner/proposals','S-07 내 제안'],['#/partner/stats','S-09 성과'],['#/ops','A-04 지표 대시보드'],['#/ops/live','A-05 접수 조건(실데이터)'],['#/brand','◆ 로고 시스템']];
$('#jump').innerHTML = ROUTES.map(([h,l])=>`<option value="${h}">${l}</option>`).join('');
$('#jump').addEventListener('change', e=>{ if(e.target.value.startsWith('#/partner/propose')) S.timeLeft=900; go(e.target.value); });

window.addEventListener('hashchange', render);
render();
</script>
